<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Changements en attente - Gestion des Impayés</title></head>
<body>
<section>

  <input type="hidden" id="csrf-token" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  <input type="hidden" id="csrf-header" th:value="${_csrf.headerName}">

  <!-- En-tête -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="fw-bold mb-0">
        <i class="fas fa-user-edit me-2 text-info"></i>Changements données client
      </h5>
      <small class="text-muted">Tous les mois confondus</small>
    </div>
    <div class="d-flex gap-2">
      <a th:href="@{/changements}" th:classappend="${reseauFiltre == ''} ? 'btn-primary' : 'btn-outline-secondary'"
         class="btn btn-sm">Tous</a>
      <a th:href="@{/changements(reseau=BNI)}" th:classappend="${reseauFiltre == 'BNI'} ? 'btn-dark' : 'btn-outline-dark'"
         class="btn btn-sm">BNI</a>
      <a th:href="@{/changements(reseau=SIB)}" th:classappend="${reseauFiltre == 'SIB'} ? 'btn-info' : 'btn-outline-info'"
         class="btn btn-sm">SIB</a>
    </div>
  </div>

  <div>
    <div id="tab-client">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <small class="text-muted">
          <i class="fas fa-clock me-1"></i>
          <span th:if="${!toutVoir}">3 derniers mois</span>
          <span th:if="${toutVoir}">Tout l'historique</span>
        </small>
        <a th:if="${!toutVoir}"
           th:href="@{/changements(reseau=${reseauFiltre}, toutVoir=true)}"
           class="btn btn-sm btn-outline-secondary">
          <i class="fas fa-history me-1"></i>Voir tout l'historique
        </a>
        <a th:if="${toutVoir}"
           th:href="@{/changements(reseau=${reseauFiltre})}"
           class="btn btn-sm btn-outline-primary">
          <i class="fas fa-compress-alt me-1"></i>3 derniers mois
        </a>
      </div>
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover table-sm mb-0" style="font-size:13px">
              <thead class="table-light">
                <tr>
                  <th>Période</th>
                  <th>Réseau</th>
                  <th>N° Client</th>
                  <th>Nom</th>
                  <th>Champ modifié</th>
                  <th>Valeur précédente</th>
                  <th>Nouvelle valeur</th>
                  <th>Détecté le</th>
                  <th>Fiche</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="c : ${changementsClient}">
                  <td>
                    <span class="badge bg-secondary" th:text="${c.mois + '/' + c.annee}"></span>
                  </td>
                  <td>
                    <span class="badge"
                          th:classappend="${c.reseau?.name() == 'SIB'} ? 'bg-info text-dark' : 'bg-dark'"
                          th:text="${c.reseau ?: 'BNI'}"></span>
                  </td>
                  <td class="fw-semibold" th:text="${c.numeroClient}"></td>
                  <td th:text="${c.nomClient}"></td>
                  <td><span class="badge bg-secondary" th:text="${c.champLabel}"></span></td>
                  <td>
                    <span th:if="${c.valeurAvant != null}" class="text-danger" th:text="${c.valeurAvant}"></span>
                    <span th:if="${c.valeurAvant == null}" class="text-muted fst-italic">vide</span>
                  </td>
                  <td><span class="text-success fw-semibold" th:text="${c.valeurApres}"></span></td>
                  <td style="font-size:11px"
                      th:text="${c.dateDetection != null ? #temporals.format(c.dateDetection,'dd/MM/yyyy HH:mm') : '—'}"></td>
                  <td>
                    <a th:href="@{/clients/{id}(id=${c.clientId})}"
                       class="btn btn-sm btn-outline-primary py-0 px-2" title="Fiche client">
                      <i class="fas fa-user"></i>
                    </a>
                  </td>
                </tr>
                <tr th:if="${changementsClient.empty}">
                  <td colspan="9" class="text-center text-muted py-5">
                    <i class="fas fa-check-circle fa-3x text-success mb-2 d-block"></i>
                    Aucun changement de données client.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

</section>
</body>
</html>
